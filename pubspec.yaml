name: maoneauto
description: "MaoneAuto - Smart Auto Reply & Tree Menu Bot for WhatsApp by MaoneArt"
publish_to: 'none'
version: 1.0.44+45

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local Storage & Preferences
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # CSV Parsing & File Handling
  csv: ^6.0.0
  file_picker: ^8.1.4
  share_plus: ^10.1.2

  # Networking for AI & Webhook Server
  http: ^1.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sample_menu.csv
